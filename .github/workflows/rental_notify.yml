# ============================================================
# 嘉義房租 雲端通知排程（GitHub Actions）
# 檔案位置：.github/workflows/rental_notify.yml
# 功能：每日定時跑 rental_cloud_notify.py（租約、維護、預存、帳單期限、哥弟結算），
#       用 Gmail 自動寄提醒信給房東 —— 筆電關機也收得到；每次執行寫雲端心跳（網頁顯示）。
# ★09230021：排程由台灣 08:00 改為 20:30（鐵律ＡＭ１④：非急迫通知一律當晚 20:30；主帥 08/30 13:23「全面改成當天晚上 20:30」）
# ★09262351 丁案：排程改 15:30＋20:30 兩班（主帥 2026/09/26 15:26「我採用你的建議,我選丁案。」）
#   原因：GitHub 排程對本倉庫固定延後約 4.5～5 小時（主帥截圖 09261508：08:00 班實際 12:24～12:42；20:30 班實際 01:20～01:25，落在睡眠時段而不寄信）
#   15:30 班照實測延後約在 20:00～20:30 執行；程式由當天第一個準時（21:30 前）班次寄出，同日後續班次只寫心跳（同日去重）；20:30 班保留當備援
# 台灣時間 = UTC+8
# ============================================================
# ★★★【自我舉證表】rental_notify(09230021).yml（ＡＭ２５）
#   ・cron 改 '30 12 * * *'（UTC 12:30＝台灣 20:30）｜主帥 2026/08/30 13:23「全面改成當天晚上 20:30」（ＡＭ１④）
#   ・名稱改「每日20:30＋心跳」｜主帥 2026/09/23 00:0x 題二 A；實測見改版記錄(09230021) 第十一章⑥
# ★★★【推定清單】
#   ・推定 GitHub 排程延遲不超過約半小時 → ★09262351 已被推翻（實測固定延後約 4.5～5 小時，截圖 09261508）
#   ・★09262351 推定延後維持約 4.5～5 小時 → 若縮短：15:30 班即在 15:30 起寄出（非睡眠時段）；若超過 6 小時：兩班皆落入睡眠時段，隔天第一個準時班次補寄，網頁紅字提醒
name: 嘉義房租雲端通知（每日20:30＋心跳）

on:
  schedule:
    # ★09262351 丁案 主班：台灣 15:30 = UTC 07:30（實測延後約 4.5～5 小時 → 約 20:00～20:30 執行並寄信）
    - cron: '30 7 * * *'
    # 備援班：台灣 20:30 = UTC 12:30（實測常延到次日 01:2x 睡眠時段；當天已由主班寄過則只寫心跳）
    - cron: '30 12 * * *'
  # 允許手動觸發（測試用）
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install google-auth requests

      - name: 執行房租雲端通知
        env:
          GMAIL_ACCOUNT:        ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_PASSWORD:       ${{ secrets.GMAIL_PASSWORD }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          NOTIFY_TO:            ${{ secrets.NOTIFY_TO }}
        run: python rental_cloud_notify.py
