# ============================================================
# 嘉義房租 雲端通知排程（GitHub Actions）
# 檔案位置：.github/workflows/rental_notify.yml
# 功能：每日定時跑 rental_cloud_notify.py（租約、維護、預存、帳單期限、哥弟結算），
#       用 Gmail 自動寄提醒信給房東 —— 筆電關機也收得到；每次執行寫雲端心跳（網頁顯示）。
# ★09230021：排程由台灣 08:00 改為 20:30（鐵律ＡＭ１④：非急迫通知一律當晚 20:30；主帥 08/30 13:23「全面改成當天晚上 20:30」）
# 台灣時間 = UTC+8
# ============================================================
# ★★★【自我舉證表】rental_notify(09230021).yml（ＡＭ２５）
#   ・cron 改 '30 12 * * *'（UTC 12:30＝台灣 20:30）｜主帥 2026/08/30 13:23「全面改成當天晚上 20:30」（ＡＭ１④）
#   ・名稱改「每日20:30＋心跳」｜主帥 2026/09/23 00:0x 題二 A；實測見改版記錄(09230021) 第十一章⑥
# ★★★【推定清單】
#   ・推定 GitHub 排程延遲不超過約半小時 → 若為假（例如延遲逾 1 小時）：信件晚於 21:30 送達；心跳列仍會顯示實際執行時間
name: 嘉義房租雲端通知（每日20:30＋心跳）

on:
  schedule:
    # 台灣每日 20:30 = UTC 12:30（GitHub 排程常延遲數分鐘至約半小時，仍在 21:30 睡眠時段前）
    - cron: '30 12 * * *'
  # 允許手動觸發（測試用）
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install google-auth requests

      - name: 執行房租雲端通知
        env:
          GMAIL_ACCOUNT:        ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_PASSWORD:       ${{ secrets.GMAIL_PASSWORD }}
          FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}
          NOTIFY_TO:            ${{ secrets.NOTIFY_TO }}
        run: python rental_cloud_notify.py
